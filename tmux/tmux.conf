# -------------------------------------------------------------------
# Prefix Configuration (Zero Emacs Conflicts)
# -------------------------------------------------------------------

# Set prefix to Ctrl+\ (Emacs leaves this completely unmapped globally)
set -g prefix 'C-\'
unbind C-b

# Press Ctrl+\ TWICE to send a literal Ctrl+\ to Emacs if ever needed
bind 'C-\' send-prefix


# -------------------------------------------------------------------
# General & Usability Settings
# -------------------------------------------------------------------

# Enable mouse support (allows clicking tabs, resizing panes, and scrolling)
set -g mouse on

# Increase scrollback buffer history from 2000 to 10000 lines
set -g history-limit 10000

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Fix colors to look correct inside tmux (enables 256-color support)
set -g default-terminal "screen-256color"

# Don't rename windows automatically
set -g allow-rename off


# -------------------------------------------------------------------
# Key Bindings
# -------------------------------------------------------------------

# Easy config reload (Press: Ctrl+\ then r)
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# Split panes using easier-to-remember keys
# Split horizontally with |
bind | split-window -h -c "#{pane_current_path}"
# Split vertically with -
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes easily using Alt-Arrow keys without using the prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# -------------------------------------------------------------------
# Status Bar Look & Feel (With Dynamic Teal Prefix Highlight)
# -------------------------------------------------------------------

# Clean status bar background and default text color
set -g status-style bg=black,fg=white

# Highlight the active window in the status bar (Using your teal accent color)
setw -g window-status-current-style bg=#007f7f,fg=white,bold

# Dynamic indicator: Changes to teal when prefix is pressed, otherwise matches the background
set -g status-left "#{?client_prefix,#[bg=#007f7f]#[fg=white]#[bold] TMUX ,#[bg=black]#[fg=white] TMUX }"

# Optional: Add the same visual indicator to the right side (shows a teal block next to date/time)
set -g status-right "#{?client_prefix,#[bg=#007f7f]#[fg=white]#[bold] %Y-%m-%d %H:%M ,#[bg=black]#[fg=gray] %Y-%m-%d %H:%M }"
