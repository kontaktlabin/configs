[Service]
# Core Context Modification
Environment="LLAMA_ARG_CTX_SIZE=65536"

# Target the unified QAT conversion repository (handles target + MTP auto-linking)
Environment="LLAMA_ARG_HF_REPO=unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL"

# Native Template Settings
Environment="LLAMA_ARG_JINJA=true"

# Speculative Decoding / Multi-Token Prediction Setup
Environment="LLAMA_ARG_SPEC_TYPE=draft-mtp"
Environment="LLAMA_ARG_SPEC_DRAFT_N_MAX=4"

# Complete GPU Acceleration (VRAM Offloading)
Environment="LLAMA_ARG_N_GPU_LAYERS=99"
Environment="LLAMA_ARG_N_GPU_LAYERS_DRAFT=all"
Environment="LLAMA_ARG_FLASH_ATTN=on"
