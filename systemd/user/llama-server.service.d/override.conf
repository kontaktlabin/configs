[Service]
# Core Context Modification: Keeping it high unless OOM persists
Environment="LLAMA_ARG_CTX_SIZE=65536"

# Target the unified QAT conversion repository (handles target + MTP auto-linking)
Environment="LLAMA_ARG_HF_REPO=unsloth/gemma-4-E4B-it-qat-GGUF:UD-Q4_K_XL"

# Native Template Settings
Environment="LLAMA_ARG_JINJA=true"

# Speculative Decoding / Multi-Token Prediction Setup
Environment="LLAMA_ARG_SPEC_TYPE=draft-mtp"
Environment="LLAMA_ARG_SPEC_DRAFT_N_MAX=4"

# Complete GPU Acceleration & UMA Performance Fixes
Environment="LLAMA_ARG_N_GPU_LAYERS=999"
Environment="LLAMA_ARG_N_GPU_LAYERS_DRAFT=999"
Environment="LLAMA_ARG_FLASH_ATTN=on"
# Critical for UMA systems (like Strix Halo) to prevent slow loading via MMap
Environment="LLAMA_ARG_MMAP=false" 

# Memory Optimization (KV Cache Quantization)
Environment="LLAMA_ARG_CACHE_TYPE_K=q4_0"
Environment="LLAMA_ARG_CACHE_TYPE_V=q4_0"

# Batch Size Optimization
Environment="LLAMA_ARG_UBATCH=512"