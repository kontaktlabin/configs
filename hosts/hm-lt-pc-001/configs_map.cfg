[mappings]
$HOME/.zshrc = $CONFIGS_DIR/zsh/.zshrc
$HOME/.zprofile = $CONFIGS_DIR/zsh/.zprofile
$HOME/.emacs.d/config.org = $CONFIGS_DIR/emacs/config.org
$HOME/.emacs.d/config.el = $CONFIGS_DIR/emacs/config.el
$HOME/.emacs.d/init.el = $CONFIGS_DIR/emacs/init.el
$HOME/.emacs.d/custom.el = $CONFIGS_DIR/emacs/custom.el
$HOME/.emacs.d/early-init.el = $CONFIGS_DIR/emacs/early-init.el
$HOME/.gitconfig = $CONFIGS_DIR/git/.gitconfig
$HOME/.config/ghostty/config = $CONFIGS_DIR/ghostty/config
$HOME/Library/Application\ Support/VSCodium/User/settings.json = $CONFIGS_DIR/vscode/settings.json
$HOME/.local/bin = $CONFIGS_DIR/bin
$HOME/.config/git/gitk = $CONFIGS_DIR/git/gitk

