[mkarch.network.hm]
type = static
interface = en*
ip = 192.168.10.5/24
gateway = 192.168.10.1
dns = 1.1.1.1

[mkarch.network.beta]
type = dhcp
interface = en*

[mkarch.packages]
emacs
git
sudo
openssh

[mappings]
$HOME/.emacs.d/early-init.el = $CONFIGS_DIR/emacs/early-init.el
$HOME/.emacs.d/custom.el = $CONFIGS_DIR/emacs/custom.el
$HOME/.emacs.d/config.el = $CONFIGS_DIR/emacs/config.el
$HOME/.emacs.d/config.org = $CONFIGS_DIR/emacs/config.org
$HOME/.emacs.d/init.el = $CONFIGS_DIR/emacs/init.el
$HOME/.bash_profile = $CONFIGS_DIR/bash/.bash_profile
$HOME/.bashrc = $CONFIGS_DIR/bash/.bashrc
$HOME/.gitconfig = $CONFIGS_DIR/git/.gitconfig
$HOME/.ssh/config = $CONFIGS_DIR/ssh/config
$HOME/.psqlrc = $CONFIGS_DIR/psql/.psqlrc
$HOME/.config/starship.toml = $CONFIGS_DIR/starship/starship.toml
$HOME/.config/Code - OSS/User/settings.json = $CONFIGS_DIR/vscode/settings.json
$HOME/.inputrc = $CONFIGS_DIR/readline/.inputrc
$HOME/.config/bat/config = $CONFIGS_DIR/bat/config
$HOME/.config/kglobalshortcutsrc = $CONFIGS_DIR/kde/kglobalshortcutsrc
$HOME/.local/bin = $CONFIGS_DIR/bin
$HOME/.config/git/gitk = $CONFIGS_DIR/git/gitk

